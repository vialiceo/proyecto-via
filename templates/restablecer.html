{% extends '_auth_card.html' %}
{% block titulo %}Nueva contraseña{% endblock %}
{% block card_titulo %}Nueva<br>contraseña{% endblock %}

{% block contenido %}
  <form class="recuperar-form" action="{{ url_for('auth.restablecer', token=token) }}" method="POST" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

    <div class="field-group">
      <label for="password">Nueva contraseña</label>
      <input type="password" id="password" name="password" minlength="8" autocomplete="new-password" required />
    </div>

    <div class="field-group">
      <label for="password_confirmacion">Confirma la contraseña</label>
      <input type="password" id="password_confirmacion" name="password_confirmacion" minlength="8" autocomplete="new-password" required />
    </div>

    <button class="btn-restablecer" type="submit">GUARDAR CONTRASEÑA</button>
  </form>

  <a href="{{ url_for('auth.login') }}" class="link-volver">← Volver al inicio de sesión</a>
{% endblock %}
