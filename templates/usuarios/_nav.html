<!-- ============================================================
     MOLDE NAV — Usuarios
     Uso: {% raw %}{% include 'usuarios/_nav.html' %}{% endraw %}
     ============================================================ -->

<aside class="sidebar-nav" id="sidebarNav">

  <!-- Botón toggle (hamburger) -->
  <button class="nav-toggle" id="navToggle" aria-label="Abrir o cerrar menú">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <!-- Escudo / logo -->
  <a href="{{ url_for('public.index') }}" class="nav-shield-link" aria-label="Ir al inicio">
    <div class="nav-shield">
      <span class="ns-top">EXCELSIOR</span>
      <div class="ns-stars">★ ★</div>
      <div class="ns-sun">☀</div>
      <span class="ns-bottom">LICEO T.</span>
    </div>
  </a>

  <!-- Enlaces -->
  <nav aria-label="Menú de usuarios">
    <ul class="nav-list">
      <li class="nav-item {% if active_page == 'principal' %}active{% endif %}">
        <a href="{{ url_for('public.index') }}" class="nav-link">PRINCIPAL</a>
      </li>
      <li class="nav-item {% if active_page == 'actualizar' %}active{% endif %}">
        <a href="{{ url_for('usuarios.perfil') }}" class="nav-link">ACTUALIZAR INFORMACIÓN</a>
      </li>
      <li class="nav-item {% if active_page == 'ayuda' %}active{% endif %}">
        <a href="{{ url_for('public.ayuda') }}" class="nav-link">AYUDA</a>
      </li>
      <li class="nav-item {% if active_page == 'comentarios' %}active{% endif %}">
        <a href="{{ url_for('usuarios.comentarios') }}" class="nav-link">COMENTARIOS</a>
      </li>
      {% if current_user.is_authenticated and current_user.rol == 'administrador' %}
      <li class="nav-item {% if active_page == 'admin' %}active{% endif %}">
        <a href="{{ url_for('admin.dashboard') }}" class="nav-link">ADMINISTRACIÓN</a>
      </li>
      {% endif %}
    </ul>
  </nav>

</aside>
