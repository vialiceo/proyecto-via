{% extends '_auth_card.html' %}
{% block titulo %}Recuperar Contraseña{% endblock %}
{% block card_titulo %}Recuperación de<br>contraseña{% endblock %}

{% block contenido %}
  <form class="recuperar-form" action="{{ url_for('auth.recuperar') }}" method="POST" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

    <div class="field-group">
      <label for="identificador">Ingresa tu correo o tu usuario V.I.A</label>
      <input
        type="text"
        id="identificador"
        name="identificador"
        autocomplete="username email"
        required
      />
    </div>

    <button class="btn-restablecer" type="submit">RESTABLECER CONTRASEÑA</button>
  </form>

  <a href="{{ url_for('auth.login') }}" class="link-volver">← Volver al inicio de sesión</a>
{% endblock %}
