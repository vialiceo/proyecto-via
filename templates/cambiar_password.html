{% extends '_auth_card.html' %}
{% block titulo %}Cambiar contraseña{% endblock %}
{% block card_titulo %}Cambiar<br>contraseña{% endblock %}

{% block contenido %}
  <form class="recuperar-form" action="{{ url_for('auth.cambiar_password') }}" method="POST" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

    <div class="field-group">
      <label for="password_actual">Contraseña actual</label>
      <input type="password" id="password_actual" name="password_actual" autocomplete="current-password" required />
    </div>

    <div class="field-group">
      <label for="password">Nueva contraseña</label>
      <input type="password" id="password" name="password" minlength="8" autocomplete="new-password" required />
    </div>

    <div class="field-group">
      <label for="password_confirmacion">Confirma la nueva contraseña</label>
      <input type="password" id="password_confirmacion" name="password_confirmacion" minlength="8" autocomplete="new-password" required />
    </div>

    <button class="btn-restablecer" type="submit">GUARDAR CONTRASEÑA</button>
  </form>

  {% if current_user.is_authenticated and not current_user.forzar_cambio_password %}
    <a href="{{ url_for('public.index') }}" class="link-volver">← Volver al inicio</a>
  {% endif %}
{% endblock %}
