<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preparando tu sesión — V.I.A</title>

  {# Respaldo sin JavaScript: si el navegador no ejecuta el script, igual
     avanza al destino a los 2 segundos. #}
  <meta http-equiv="refresh" content="2; url={{ destino }}" />

  <link rel="icon" type="image/svg+xml" href="/static/img/favicon/favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Cinzel:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --verde-oscuro: #0d2318;
      --verde-fondo:  #14331f;
      --oro:          #c9a227;
      --oro-claro:    #f0c84a;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 40%, #1c4a2d 0%, var(--verde-oscuro) 70%);
      color: #fff;
      font-family: 'Lato', sans-serif;
      text-align: center;
      padding: 2rem;
    }

    .prep {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.4rem;
      animation: prep-aparecer 0.5s ease-out both;
    }

    @keyframes prep-aparecer {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }

    .prep-marca {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 3.4rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      line-height: 1;
      color: #fff;
    }

    .prep-marca-sub {
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--oro-claro);
      margin-top: 0.5rem;
    }

    /* Anillo giratorio con degradado oro sobre pista tenue. */
    .prep-anillo {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      border: 4px solid rgba(255, 255, 255, 0.12);
      border-top-color: var(--oro);
      border-right-color: var(--oro-claro);
      animation: prep-girar 0.9s linear infinite;
      margin: 0.6rem 0;
    }

    @keyframes prep-girar { to { transform: rotate(360deg); } }

    .prep-titulo {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.5rem;
      font-weight: 700;
    }

    .prep-texto {
      font-size: 0.95rem;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.72);
      max-width: 22rem;
    }

    .prep-nota {
      font-size: 0.78rem;
      color: rgba(255, 255, 255, 0.4);
      margin-top: 0.6rem;
      letter-spacing: 0.04em;
    }

    @media (prefers-reduced-motion: reduce) {
      .prep-anillo { animation: prep-pulso 1.2s ease-in-out infinite; }
      @keyframes prep-pulso { 0%,100% { opacity: 1 } 50% { opacity: 0.4 } }
    }
  </style>
</head>
<body>

  <main class="prep" role="status" aria-live="polite">
    <div>
      <div class="prep-marca">V.I.A</div>
      <div class="prep-marca-sub">Vinculación Integral de Alumnos</div>
    </div>

    <div class="prep-anillo" aria-hidden="true"></div>

    <h1 class="prep-titulo">Preparando tu sesión</h1>
    <p class="prep-texto">Estamos dejando todo listo en el portal del Liceo Tame. Esto solo toma un momento.</p>
    <p class="prep-nota">No cierres esta ventana</p>
  </main>

  <script>
    // Salta al destino con replace() para que la pantalla no quede en el
    // historial: al pulsar "atrás" no se vuelve al loader.
    var destino = {{ destino | tojson }};
    setTimeout(function () { window.location.replace(destino); }, 1400);
  </script>

</body>
</html>
