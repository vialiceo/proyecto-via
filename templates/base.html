<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Footer – V.I.A</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    /* Standalone footer styles
       Si usas el footer junto al index.html,
       basta con copiar el bloque <footer> al HTML principal
       y asegurarte de que styles.css esté enlazado.
    --------------------------------------------------------- */

    :root {
      --green-dark:  #1a3d2b;
      --gold:        #c9a227;
      --gold-light:  #f0c84a;
      --text-dim:    rgba(255,255,255,0.5);
      --font-display: 'Cinzel', serif;
      --font-body:   'Lato', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      /* Only for standalone preview */
      background: #0d2318;
      display: flex;
      align-items: flex-end;
      min-height: 100vh;
    }

    /* ── Footer ── */
    .site-footer {
      width: 100%;
      height: 44px;
      background: #0d2318;
      border-top: 1px solid rgba(201,162,39,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3rem;
      padding: 0 2rem;
    }

    .footer-link {
      font-family: var(--font-display);
      font-size: 0.6rem;
      letter-spacing: 0.22em;
      color: var(--text-dim);
      text-decoration: none;
      cursor: pointer;
      transition: color 0.2s;
    }

    .footer-link:hover {
      color: var(--gold-light);
    }

    .footer-copy {
      font-family: var(--font-body);
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      color: var(--text-dim);
      margin-left: auto;
    }

    @media (max-width: 480px) {
      .site-footer { gap: 1.2rem; }
      .footer-copy { margin-left: 0; }
    }
  </style>
</head>
<body>

  <footer class="site-footer">
    <a href="#" class="footer-link">EQUIPO DE TRABAJO</a>
    <a href="#" class="footer-link">CONTACTO</a>
    <span class="footer-copy">©2026 V I A</span>
  </footer>

</body>
</html>
